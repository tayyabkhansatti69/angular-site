<router-outlet></router-outlet>

<!-- toast-container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    id="liveToast"
    class="toast border-0 shadow-lg"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-body">
      <!-- header -->
      <div class="d-flex gap-1 justify-content-between align-items-center">
        <div id="toast-title" class="d-flex gap-2 flex-fill fw-bold"></div>
        <button
          type="button"
          class="btn-close small m-0"
          data-bs-dismiss="toast"
          aria-label="Close"
        ></button>
      </div>

      <!-- body -->
      <p id="toast-msg" class="mx-2 mb-0"></p>
    </div>
  </div>
</div>
