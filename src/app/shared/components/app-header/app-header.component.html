<header
  class="fixed-top text-nowrap d-xxl-flex rounded-5 px-3 mx-3 my-3"
  data-aos="fade-down"
  data-aos-duration="1000"
  data-aos-easing="ease-out-back"
  data-aos-delay="500"
>
  <nav class="navbar navbar-expand-lg flex-grow-1">
    <div class="container-fluid px-0">
      <!-- Logo -->
      <a class="p-0 m-0" routerLink="/">
        <div [ngTemplateOutlet]="logo"></div>
      </a>

      <!-- toggle btn -->
      <button
        class="navbar-toggler d-lg-none p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target=".multi-collapse"
        aria-expanded="false"
        aria-controls="nav1 nav2"
      >
        <i class="bi bi-list m-0"></i>
      </button>

      <!-- nav bar -->
      <div
        class="multi-collapse toggled-menu collapse navbar-collapse flex-grow-1 justify-content-between"
        id="nav1"
      >
        <ul class="navbar-nav align-items-lg-center mx-lg-5 my-3 my-lg-0">
          <!-- home -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/"
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
              i18n
            >
              Home
            </a>
          </li>
          <!-- Find Tutors -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/find-tutor"
              routerLinkActive="active-link"
              i18n
            >
              Find Tutors
            </a>
          </li>
          <!-- Business training -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/coporate-training"
              routerLinkActive="active-link"
              i18n
            >
              Business training
            </a>
          </li>
          <!-- Become a Tutor -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/become-tutor"
              routerLinkActive="active-link"
              i18n
            >
              Become a Tutor
            </a>
          </li>
          <!-- Become a Tutor -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/blogs"
              routerLinkActive="active-link"
              i18n
            >
              Blogs
            </a>
          </li>
          <!-- all-courses -->
          <li class="nav-item">
            <a
              class="nav-link"
              aria-current="page"
              routerLink="/all-courses"
              routerLinkActive="active-link"
              i18n
            >
              Courses
            </a>
          </li>
        </ul>
      </div>

      <!-- toggeler Forms -->
      <button
        class="navbar-toggler d-none d-lg-block d-xxl-none border-0 shadow-none p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav2"
        aria-controls="nav2"
        aria-expanded="false"
      >
        <i class="bi bi-three-dots m-0"></i>
      </button>
    </div>
  </nav>

  <!-- Forms -->
  <nav class="navbar navbar-expand-xxl py-0 py-xxl-2">
    <div class="container-fluid px-0">
      <div class="multi-collapse collapse navbar-collapse gap-2" id="nav2">
        <!-- Search form -->
        <form
          [formGroup]="searchForm"
          onsubmit="onSearch()"
          class="d-flex align-items-center justify-content-center border rounded-pill py-1 px-2 mb-3 mt-2 my-xxl-0"
          role="search"
        >
          <!-- <select
            formControlName="category"
            class="shadow-none bg-transparent fw-light border-0 p-0 px-1"
          >
            <option value="all" selected i18n>Categories</option>

            <option *ngFor="let item of categories" [value]="item">
              {{ item | titlecase }}
            </option>
          </select> -->

          <!-- <div class="vr opacity-100 mx-2"></div> -->

          <input
            type="search"
            formControlName="searchValue"
            class="form-control fw-light border-0 shadow-none bg-transparent py-0"
            placeholder="Find Course..."
            i18n-placeholder
            aria-label="Search"
          />

          <button class="btn btn-main rounded-pill btn-sm" type="submit">
            <i class="bi bi-search m-0"></i>
          </button>
        </form>

        <!-- Change Language Form -->
        <app-langs-form></app-langs-form>

        <!-- Login -->
        <a
          *ngIf="!logined"
          class="btn btn-main rounded-pill px-4 my-3 my-xxl-0"
          routerLink="/auth/sign-in"
          i18n
        >
          Log in
        </a>

        <div *ngIf="logined" class="dropdown">
          <a
            class="dropdown-toggle d-flex align-items-center gap-1 p-2"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              class="bi bi-person-circle"
              viewBox="0 0 16 16"
            >
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
              <path
                fill-rule="evenodd"
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
              />
            </svg>
          </a>

          <ul class="dropdown-menu dropdown-menu-end">
            <!-- Log out -->
            <li>
              <a
                routerLink="/dashboard"
                class="text-main p-2"
                href="#"
                role="button"
                i18n
              >
                Dashboard
              </a>
            </li>
            <li>
              <a
                class="text-main p-2"
                href="#"
                role="button"
                (click)="onLogout()"
                i18n
              >
                Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
