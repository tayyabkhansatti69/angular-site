<section class="bg-main overflow-hidden py-5">
  <!-- circles -->
  <img
    src="../assets/icons/bg/bg-top-circles.svg"
    class="position-absolute top-0 start-0 col-5"
  />
  <img
    src="../assets/icons/bg/bg-bottom-circles.svg"
    class="position-absolute bottom-0 end-0 col-5"
  />

  <div class="container py-5">
    <div class="card rounded-4 overflow-hidden border-0 shadow-sm mt-5">
      <div class="row" style="min-height: 630px">
        <!-- image -->
        <div
          class="col-lg-6 d-flex flex-column justify-content-center align-items-center rounded-4 overflow-hidden z-3 p-lg-5 py-5"
        >
          <!-- Overlay -->
          <img
            src="../assets/images/dashboard-bg.png"
            class="img-overlay object-fit-cover"
          />
          <div class="overlay"></div>

          <img
            src="../assets/icons/logo/logo.svg"
            class="col-9 col-lg-8 mb-3"
          />

          <p class="h3 text-light fw-light my-4">
            <span class="d-block mb-2" i18n>Welcome to</span>
            <span i18n>Tutor Hub Dashboard</span>
          </p>
        </div>

        <!-- content -->
        <div class="col-lg-6">
          <div class="py-5 px-4 px-lg-5 mb-5">
            <!-- title -->
            <h3 i18n>Set a password</h3>
            <p class="fw-light small mb-5" i18n>
              Your previous password has been reseted. Please set a new password
              for your account.
            </p>

            <!-- Form body -->
            <form
              [formGroup]="setPasswordForm"
              (ngSubmit)="submitSetPassword()"
            >
              <!-- password -->
              <div class="mb-3 position-relative">
                <label
                  for="password"
                  class="form-label legend-label text-secondary bg-white px-2 mx-2"
                >
                  <small i18n>Create Password</small>
                </label>

                <input
                  #passwordControl
                  formControlName="password"
                  type="password"
                  class="form-control text-secondary rounded-3 shadow-sm text- p-3 pe-5"
                  id="password"
                />

                <!-- icon -->
                <i
                  (click)="
                    passwordControl.type =
                      passwordControl.type === 'password' ? 'text' : 'password'
                  "
                  class="position-absolute top-50 end-0 p-0 me-4"
                  [ngClass]="{
                    'bi bi-eye': passwordControl.type === 'password',
                    'bi bi-eye-slash': passwordControl.type === 'text'
                  }"
                ></i>
              </div>

              <!-- rePassword -->
              <div class="mb-3 position-relative">
                <label
                  for="confirm-password"
                  class="form-label legend-label text-secondary bg-white px-2 mx-2"
                >
                  <small i18n>Re-enter Password</small>
                </label>

                <input
                  #rePasswordControl
                  type="password"
                  formControlName="confirmPassword"
                  type="password"
                  class="form-control text-secondary rounded-3 shadow-sm text- p-3 pe-5"
                  id="confirm-password"
                />

                <!-- icon -->
                <i
                  (click)="
                    rePasswordControl.type =
                      rePasswordControl.type === 'password'
                        ? 'text'
                        : 'password'
                  "
                  class="position-absolute top-50 end-0 p-0 me-4"
                  [ngClass]="{
                    'bi bi-eye': rePasswordControl.type === 'password',
                    'bi bi-eye-slash': rePasswordControl.type === 'text'
                  }"
                ></i>
              </div>

              <!-- Submit -->
              <button
                class="btn btn-main-lighter d-block col-7 mx-auto py-2 mt-4"
                i18n
              >
                Set password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
