<section class="bg-main overflow-hidden py-5">
  <!-- circles -->
  <img
    src="../assets/icons/bg/bg-top-circles.svg"
    class="position-absolute top-0 start-0 col-5"
  />
  <img
    src="../assets/icons/bg/bg-bottom-circles.svg"
    class="position-absolute bottom-0 end-0 col-5"
  />

  <div class="container py-5">
    <div class="card rounded-4 overflow-hidden border-0 shadow-sm mt-5">
      <div class="row">
        <!-- image -->
        <div
          class="col-lg-6 d-flex flex-column justify-content-center align-items-center rounded-4 overflow-hidden z-3 p-lg-5 py-5"
        >
          <!-- Overlay -->
          <img
            src="../assets/images/dashboard-bg.png"
            class="img-overlay object-fit-cover"
          />
          <div class="overlay"></div>

          <img
            src="../assets/icons/logo/logo.svg"
            class="col-9 col-lg-8 mb-3"
          />

          <p class="h3 text-light fw-light my-4">
            <span class="d-block mb-2" i18n>Welcome to</span>
            <span i18n>Tutor Hub Dashboard</span>
          </p>
        </div>

        <!-- content -->
        <div class="col-lg-6">
          <div class="py-5 px-4 px-lg-5">
            <!-- title -->
            <h3 i18n>Login</h3>
            <p class="fw-light small mb-5" i18n>
              Login to access your Tutor hub account
            </p>

            <!-- Form body -->
            <form [formGroup]="loginForm" (ngSubmit)="submitLogin(loginForm)">
              <!-- email -->
              <div class="mb-3">
                <label
                  for="email"
                  class="form-label small legend-label text-secondary bg-white px-2 mx-2"
                  i18n
                >
                  Your email
                </label>

                <input
                  formControlName="email"
                  type="email"
                  class="form-control text-secondary rounded-3 shadow-sm p-3"
                  id="email"
                />
              </div>

              <!-- password -->
              <div class="mb-3 position-relative">
                <label
                  for="password"
                  class="form-label small legend-label text-secondary bg-white px-2 mx-2"
                  i18n
                >
                  Password
                </label>

                <input
                  #passwordControl
                  formControlName="password"
                  type="password"
                  class="form-control text-secondary rounded-3 shadow-sm text- p-3 pe-5"
                  id="password"
                />

                <!-- icon -->
                <i
                  (click)="
                    passwordControl.type =
                      passwordControl.type === 'password' ? 'text' : 'password'
                  "
                  class="position-absolute top-50 end-0 p-0 me-4"
                  [ngClass]="{
                    'bi bi-eye': passwordControl.type === 'password',
                    'bi bi-eye-slash': passwordControl.type === 'text'
                  }"
                ></i>
              </div>

              <!-- role -->
              <div class="mb-3">
                <label
                  for="role"
                  class="form-label legend-label text-secondary bg-white px-2 mx-2"
                >
                  <small i18n>Role</small>
                </label>

                <select
                  formControlName="role"
                  class="form-select text-secondary rounded-3 shadow-sm p-3"
                  id="role"
                >
                  <option value="student" i18n>Student</option>
                  <option value="teacher" i18n>Teacher</option>
                  <option value="parent" i18n>Parent</option>
                  <option value="admin" i18n>Admin</option>
                  <option value="manager" i18n>Manager</option>
                </select>
              </div>

              <!-- remember me & forget password -->
              <div class="d-flex justify-content-between my-4 small">
                <div class="form-check">
                  <input
                    formControlName="rememberMe"
                    class="form-check-input"
                    type="checkbox"
                    value="true"
                    id="flexCheckDefault"
                  />
                  <label class="form-check-label" for="flexCheckDefault" i18n>
                    Remember Me
                  </label>
                </div>

                <a routerLink="/auth/forgot-password" class="text-main" i18n
                  >Forgot password?
                </a>
              </div>

              <!-- Submit -->
              <button
                class="btn btn-main-lighter d-block col-7 mx-auto py-2"
                i18n
              >
                Login
              </button>
            </form>

            <!-- Sign Up -->
            <p class="text-center mt-3">
              <small class="text-secondary">
                <span i18n>Don’t have an account?</span>
                <a
                  class="text-main fw-semibold"
                  routerLink="/auth/sign-up"
                  i18n
                >
                  Sign up
                </a>
              </small>
            </p>

            <!-- Sepatator -->
            <div class="d-flex align-items-center justify-content-center">
              <hr class="w-25" />
              <small class="text-secondary mx-2" i18n> Or login with </small>
              <hr class="w-25" />
            </div>

            <!-- Other ways -->
            <div
              class="d-flex align-items-center justify-content-center gap-4 mt-3"
            >
              <a href="">
                <i class="bi bi-facebook fs-5"></i>
              </a>

              <a href="">
                <i class="bi bi-google fs-5"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
