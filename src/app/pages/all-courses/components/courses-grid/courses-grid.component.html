<section
  class="d-flex justify-content-between align-items-center text-dark flex-wrap gap-2"
>
  <!-- res -->
  <p class="flex-grow-1 mb-3 mb-lg-0">
    <span i18n>Showing</span>
    {{ +coursesList?.length | numberFormat }}
    <span i18n>Total Results</span>
  </p>

  <!-- Sorting by -->
  <div class="d-flex justify-content-center align-items-center gap-2">
    <span class="text-secondary" i18n> Sort By </span>

    <form [formGroup]="sortingForm" (change)="onSorting()">
      <select class="form-select" formControlName="sortBy">
        <option value="popular" i18n>Most Popular</option>
        <option value="alphabetic" i18n>A - Z</option>
        <option value="price-ascending" i18n>Ascending Price</option>
        <option value="price-descending" i18n>Descending Price</option>
      </select>
    </form>
  </div>

  <!-- Sorting style -->
  <div class="d-flex justify-content-center align-items-center gap-2">
    <button
      class="btn w-auto"
      (click)="displayGrid = true"
      [ngClass]="{ 'btn-main': displayGrid, 'btn-outline-main': !displayGrid }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-grid-fill"
        viewBox="0 0 16 16"
      >
        <path
          d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5z"
        />
      </svg>
    </button>

    <button
      class="btn btn-outline-main w-auto"
      (click)="displayGrid = false"
      [ngClass]="{ 'btn-main': !displayGrid, 'btn-outline-main': displayGrid }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-list-ul"
        viewBox="0 0 16 16"
      >
        <path
          fill-rule="evenodd"
          d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"
        />
      </svg>
    </button>
  </div>
</section>

<section class="row mt-4">
  <div
    class="col-lg-6 col-xl-4"
    [ngClass]="{ 'w-100': !displayGrid }"
    *ngFor="let course of displayedCourses"
  >
    <div
      class="card card-body mb-3"
      (mouseover)="hoverCard.classList.remove('visually-hidden')"
      (mouseout)="hoverCard.classList.add('visually-hidden')"
    >
      <div [ngClass]="{ row: !displayGrid }">
        <!-- img -->
        <div [ngClass]="{ 'col-md-4': !displayGrid }">
          <img
            class="card-img object-fit-cover h-100"
            [src]="course['imgUrl']"
            width="300px"
            height="200px"
            alt="..."
          />
        </div>

        <div
          class="mt-3"
          [ngClass]="{ 'col-md-8 d-flex flex-column': !displayGrid }"
        >
          <!-- subject & rate -->
          <p class="d-flex justify-content-between align-items-center mb-4">
            <small class="bg-secondary-subtle rounded-pill px-3 py-1">
              {{ course["subject"] | titlecase }}
            </small>
            <small class="d-flex gap-1">
              <img src="./assets/icons/rating/star-fill.svg" />
              ({{ (+course["rate"]["TotalStar"]).toFixed(1) }}
              <span i18n>Rewiews</span>)
            </small>
          </p>

          <!-- course_name -->
          <h5 class="card-title fw-semibold mb-4">
            {{ course["course_name"] | titlecase }}
          </h5>

          <!-- Teacher -->
          <p
            class="card-text fw-medium mb-3"
            [ngClass]="{ 'mb-auto': !displayGrid }"
          >
            <small class="text-secondary" i18n>By</small>
            <small class="mx-1">
              {{ course["teacher"]?.name | titlecase }}
            </small>
          </p>

          <!-- Book btn -->
          <p
            class="d-flex justify-content-between align-items-center gap-2 mb-0"
          >
            <button
              routerLink="/course-details"
              [queryParams]="{ id: course['id'] }"
              class="btn btn-primary rounded-pill d-flex align-items-center gap-1 px-3"
            >
              <span class="fw-semibold" i18n>Book Trial</span>

              <svg
                width="16"
                height="16"
                viewBox="0 0 16 15"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1.15747 7.55005H14.2825M14.2825 7.55005L8.65747 1.92505M14.2825 7.55005L8.65747 13.175"
                  stroke="white"
                  stroke-width="1.875"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <span class="h5 fw-semibold text-main-lighter fw-semibold mb-0">
              ${{ course["price"] }}
            </span>
          </p>
        </div>
      </div>

      <!-- hover -->
      <div
        #hoverCard
        data-link=""
        class="card gap-2 justify-content-center align-items-center card-body border-0 bg-body-tertiary position-absolute top-100 visually-hidden shadow mb-3 z-3"
        [ngClass]="{ 'flex-row': !displayGrid }"
      >
        <img class="card-img object-fit-cover" [src]="course['imgUrl']" />
        <button
          (click)="video = course['imgUrl']"
          class="btn btn-outline-dark mt-3"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
        >
          View full schedule
        </button>
      </div>
    </div>
  </div>
</section>

<section class="d-flex justify-content-center mt-4">
  <!-- pagination btns -->
  <ul class="list-unstyled d-flex mb-0">
    <!-- prev -->
    <li>
      <button class="btn h-100" (click)="chinalyPagination(false)">
        <span aria-hidden="true">&laquo;</span>
      </button>
    </li>

    <!-- btns -->
    <div class="d-flex flex-grow-1 overflow-x-scroll">
      <li
        *ngFor="
          let item of +coursesList?.length / 12 | returnArray;
          let i = index
        "
      >
        <button
          [id]="i"
          class="btn btn-main rounded-pill p-2 px-3 m-2"
          [ngClass]="{ active: activePage == i }"
          (click)="pagination(i)"
        >
          {{ i + 1 }}
        </button>
      </li>
    </div>

    <!-- next -->
    <li>
      <button class="btn h-100" (click)="chinalyPagination()">
        <span aria-hidden="true">&raquo;</span>
      </button>
    </li>
  </ul>
</section>

<!-- Modal -->
<div
  class="modal fade"
  id="exampleModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <img class="card-img object-fit-cover" [src]="video" />
      </div>
    </div>
  </div>
</div>
